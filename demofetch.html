<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo Fetch in js</title>
    <script>
        let count=0;
        const URL="https://dummyjson.com/products";
        let rate=0;
        async function getExchangeRate(){
            
            try{
                const res= await fetch("https://open.er-api.com/v6/latest/USD");
                console.log("res=",res);
                rate= await res.json();
                console.log("rate=",rate);
                rate=rate.rates.INR;
                return rate;
            }
            catch(err){
                console.log("Error: ",err);
            }
        }

        function addToCart(title, price){
            count++;
            const ele=document.getElementById("cart");
            ele.innerHTML=`<h3>Cart: ${count} items</h3>`;
            alert(`Product ${title} added to cart with price ${price}`);
        }
        
   
        async function loadProduct(){
            try{
                const res=await fetch(URL);
                const ele1=document.getElementById("data");
                const data1=await res.json();
                console.log("data=",data1.products);
                data1.products.map((i,index)=>{
                    console.log(i.title);
                    ele1.innerHTML+=
                    `<tr>
                        <td>${index + 1}</td>
                        <td>${i.title}</td>
                        <td><img src="${i.images[0]}" width="100px" height="100px"/></td>
                        <td>${i.category}</td>
                        <td>${(i.price*rate).toFixed(2)}</td>
                        <td>${i.rating}</td>
                        <td>${i.stock}</td>
                        <td><button onclick="addToCart('${i.title}', ${i.price * rate})">Add to Cart </button></td>
                        
                     </tr>`
                        
                })

            }
            catch(err){
                console.log("Error: ",err);
            }
        }
        loadProduct();
        getExchangeRate().then((r) => {
            rate = r;
        });
    </script>
    <style>
        table{
            background-color: beige;
            color:brown;
            border:2px solid green;
            margin: auto;
            padding:20px;
        }
    </style>
</head>
<body>
    <div id="cart">
    <h3>Cart: 0 items</h3>
    </div>
    <table border="1">
        <thead>
            <tr>
                <th>Sr.No</th>
                <th>Title</th>
                <th>Image</th>
                <th>Category</th>
                <th>Price</th>
                <th>Rating</th>
                <th>Stock</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="data">

        </tbody>
    </table>
    
</body>
</html>
